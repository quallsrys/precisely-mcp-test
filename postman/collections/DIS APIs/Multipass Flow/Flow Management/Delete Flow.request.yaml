$kind: http-request
description: Delete an existing flow from your workspace. Requires Workspace Admin permissions only.
url: https://{{host}}/v1/multipass/flows/:flow_name
method: DELETE
headers:
  Authorization: Bearer {{bearer_token}}
pathVariables:
  - key: flow_name
    value: match_validation
    description: The unique identifier of the flow to delete
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
order: 5000
