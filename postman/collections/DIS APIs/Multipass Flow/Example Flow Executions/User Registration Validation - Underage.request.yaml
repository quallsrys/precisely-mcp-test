$kind: http-request
description: Execute user registration validation with underage user (age < 18). Expected to return AGE_RESTRICTION error.
url: https://{{host}}/v1/multipass/flows/:flow-name/execute
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{bearer_token}}
pathVariables:
  - key: flow-name
    value: user-registration-validation
    description: Id of the flow available to execute.
body:
  type: json
  content: |-
    {
        "input": [
            {
                "name": "Jane Smith",
                "email": "janesmithexample.com",
                "phone": "(555) 987-6543",
                "age": 30
            }
        ]
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
order: 3000
