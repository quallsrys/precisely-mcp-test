      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    runPathJobImmediately: "true"
  body:
    type: json
    content: |-
      [
        {
          "relationTypeId": "654e437bf1072e5e14d95910",
          "subjectId": "655b730e04ff6b23e7bdc353",
          "objectId": "655b730e04ff6b23e7bdc353"
        }
      ]
