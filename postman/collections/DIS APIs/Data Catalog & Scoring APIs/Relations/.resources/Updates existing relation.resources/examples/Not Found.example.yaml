$kind: http-example
request:
  url: "{{baseUrl}}/v2/catalog/relations"
  method: PATCH
  headers:
    - key: x-batch
      value: "true"
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      [
        {
          "id": "65f00e903d974a9332140bf1",
          "patch": [
            {
              "op": "replace",
              "path": "/properties",
              "value": [
                {
                  "name": "DisplayName",
                  "value": "Sherlock_Mssql-08March2024"
                },
                {
                  "name": "DisplayDescription",
                  "value": "Test Description"
                }
              ]
            }
          ]
        }
      ]
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 404,
        "error": "Not Found",
        "message": "Resource not found"
      }
order: 5000
