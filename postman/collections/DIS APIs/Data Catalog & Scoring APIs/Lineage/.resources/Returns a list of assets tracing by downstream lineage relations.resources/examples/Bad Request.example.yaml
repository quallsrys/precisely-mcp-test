$kind: http-example
request:
  url: "{{baseUrl}}/v2/catalog/lineage/:assetId/downstream/trace"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    assetId: ""
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 400,
        "error": "Bad Request",
        "message": "Bad Request"
      }
order: 2000
