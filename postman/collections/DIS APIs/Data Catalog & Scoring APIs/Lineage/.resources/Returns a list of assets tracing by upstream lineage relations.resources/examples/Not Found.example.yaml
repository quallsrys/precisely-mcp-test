$kind: http-example
request:
  url: "{{baseUrl}}/v2/catalog/lineage/:assetId/upstream/trace"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    assetId: ""
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 404,
        "error": "Not Found",
        "message": "Resource not found"
      }
order: 4000
