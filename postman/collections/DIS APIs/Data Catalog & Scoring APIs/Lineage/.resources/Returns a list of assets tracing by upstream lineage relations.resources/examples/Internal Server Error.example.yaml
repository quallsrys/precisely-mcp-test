$kind: http-example
request:
  url: "{{baseUrl}}/v2/catalog/lineage/:assetId/upstream/trace"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    assetId: ""
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 500,
        "error": "Internal Server Error",
        "message": "An unexpected error occurred"
      }
order: 6000
