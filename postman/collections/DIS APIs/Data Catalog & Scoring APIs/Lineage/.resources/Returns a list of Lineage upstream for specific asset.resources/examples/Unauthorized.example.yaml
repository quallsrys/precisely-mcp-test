$kind: http-example
request:
  url: "{{baseUrl}}/v2/catalog/lineage/:assetId/upstream"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    assetId: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 401,
        "error": "Unauthorized",
        "message": "Authentication required"
      }
order: 3000
