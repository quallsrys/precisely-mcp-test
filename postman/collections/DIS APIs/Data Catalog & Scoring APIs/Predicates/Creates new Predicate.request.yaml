$kind: http-request
description: Creates new Predicate
url: https://{{host}}/v2/catalog/predicates
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "class": "Simple",
      "name": "Sample_Predicate_29",
      "inverse": "Sample-inverse-predicate-central"
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
examples: ./.resources/Creates new Predicate.resources/examples
order: 2000
