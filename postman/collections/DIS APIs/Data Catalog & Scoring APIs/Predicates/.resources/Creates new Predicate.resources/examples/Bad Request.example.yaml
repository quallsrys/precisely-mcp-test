$kind: http-example
request:
  url: "{{baseUrl}}/v2/catalog/predicates"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "class": "Simple",
        "name": "Sample_Predicate_29",
        "inverse": "Sample-inverse-predicate-central"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 400,
        "error": "Bad Request",
        "message": "Bad Request"
      }
order: 2000
