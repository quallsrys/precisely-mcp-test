$kind: http-example
request:
  url: "{{baseUrl}}/v2/catalog/predicates/:id"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: ""
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 429,
        "error": "Too Many Requests",
        "message": "Rate limit exceeded"
      }
order: 5000
