$kind: http-example
request:
  url: "{{baseUrl}}/v2/catalog/predicates/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      [
        {
          "path": "/name",
          "op": "replace",
          "value": "NameUpdated"
        }
      ]
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 401,
        "error": "Unauthorized",
        "message": "Authentication required"
      }
order: 3000
