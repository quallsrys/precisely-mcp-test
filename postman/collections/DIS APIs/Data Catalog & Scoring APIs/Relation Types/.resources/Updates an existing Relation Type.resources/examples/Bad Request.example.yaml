$kind: http-example
request:
  url: "{{baseUrl}}/v2/catalog/relation-types/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      [
        {
          "op": "add",
          "path": "/properties/0",
          "value": {
            "name": "Link",
            "label": "Link",
            "type": "Link",
            "definition": {
              "link": {
                "defaultLabel": "Example",
                "defaultUrl": "https://www.example.com"
              }
            },
            "requirement": "Optional",
            "category": "General",
            "display": {
              "show": true,
              "showIfEmpty": true,
              "showInColumn": true
            }
          }
        }
      ]
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 400,
        "error": "Bad Request",
        "message": "Bad Request"
      }
order: 2000
