$kind: http-example
request:
  url: "{{baseUrl}}/v2/catalog/asset-types/:id"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: ""
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 503,
        "error": "Service Unavailable",
        "message": "Service temporarily unavailable"
      }
order: 7000
