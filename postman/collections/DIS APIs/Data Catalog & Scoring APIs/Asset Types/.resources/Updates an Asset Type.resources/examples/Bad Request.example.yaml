$kind: http-example
request:
  url: "{{baseUrl}}/v2/catalog/asset-types/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      [
        {
          "op": "add",
          "path": "/properties/1",
          "value": {
            "name": "BooleanField",
            "label": "Boolean values",
            "type": "Boolean",
            "description": "Adding boolean field",
            "category": "Salary Category",
            "requirement": "Optional",
            "display": {
              "show": true,
              "showIfEmpty": false,
              "showInColumn": false
            },
            "search": {
              "prefix": "",
              "suffix": "",
              "displayOrder": 1
            },
            "definition": {
              "boolean": {
                "defaultValue": true,
                "trueLabel": "false",
                "falseLabel": "false"
              }
            }
          }
        }
      ]
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 400,
        "error": "Bad Request",
        "message": "Bad Request"
      }
order: 2000
