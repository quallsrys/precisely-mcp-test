$kind: http-example
request:
  url: "{{baseUrl}}/v2/catalog/asset-types"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "class": "Business",
        "name": "QA_BUS_EXM_1",
        "displayFormat": "{Name}",
        "description": "This is a business asset type",
        "abstract": false,
        "views": [
          {
            "name": "QA_View",
            "viewType": "Grid",
            "isDefault": true,
            "columns": [
              {
                "name": "Name",
                "widthType": "Fixed",
                "widthValue": 250
              }
            ],
            "filters": [
              {
                "name": "Name",
                "persist": false
              }
            ],
            "sorts": [
              {
                "name": "Name",
                "direction": "Asc"
              }
            ]
          }
        ],
        "properties": [
          {
            "name": "Name",
            "label": "Name",
            "type": "Text",
            "description": "this is a text field",
            "category": "",
            "requirement": "Key",
            "display": {
              "show": true,
              "showIfEmpty": false,
              "showInColumn": false
            },
            "search": {
              "prefix": "",
              "suffix": "",
              "displayOrder": 1,
              "addToResult": true
            },
            "definition": {
              "text": {
                "allowRichText": false,
                "validation": {}
              }
            }
          },
          {
            "name": "Boolean",
            "label": "Boolean",
            "type": "Boolean",
            "description": "this is a boolean field",
            "category": "",
            "requirement": "Optional",
            "display": {
              "show": true,
              "showIfEmpty": false,
              "showInColumn": false
            },
            "search": {
              "prefix": "",
              "suffix": "",
              "displayOrder": 1,
              "addToResult": true
            },
            "definition": {
              "boolean": {
                "defaultValue": false
              }
            }
          }
        ]
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 429,
        "error": "Too Many Requests",
        "message": "Rate limit exceeded"
      }
order: 5000
