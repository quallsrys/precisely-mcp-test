$kind: http-example
request:
  url: "{{baseUrl}}/v2/catalog/assets"
  method: POST
  headers:
    - key: x-batch
      value: "true"
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      [
        {
          "assetTypeId": "653b82b54264fef0f9a52a06",
          "properties": [
            {
              "name": "Name",
              "value": "Test_2"
            }
          ],
          "xref": [
            "ON4Hr2P9gsV0R6akRx2Hsw=="
          ],
          "tags": []
        }
      ]
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 503,
        "error": "Service Unavailable",
        "message": "Service temporarily unavailable"
      }
order: 8000
