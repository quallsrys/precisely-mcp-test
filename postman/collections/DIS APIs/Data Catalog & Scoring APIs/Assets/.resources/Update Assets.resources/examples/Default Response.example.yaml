$kind: http-example
request:
  url: "{{baseUrl}}/v2/catalog/assets"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      [
        {
          "id": "65f00e903d974a9332140bf1",
          "patch": [
            {
              "op": "replace",
              "path": "/properties",
              "value": [
                {
                  "name": "Name",
                  "value": "Sherlock_Mssql-08March2024"
                },
                {
                  "name": "Description",
                  "value": "Test Description"
                }
              ]
            }
          ]
        }
      ]
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
