$kind: http-request
url: https://{{host}}/v1/emails/verify/batch
method: POST
body:
  type: json
  content: |-
    {
      "emails": [
        {
          "id": "1",
          "email": "example@example.com"
        },
        {
          "id": "2",
          "email": "john.smith@example.org"
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
order: 2000
